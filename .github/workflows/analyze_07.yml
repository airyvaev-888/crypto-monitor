name: 📊 Анализ рынка (12:00 +05)

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC = 12:00 +05
  workflow_dispatch:

concurrency:
  group: market-snapshot-write
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🧪 Test ntfy notification
        run: |
          curl -d "Test message from GitHub Actions" ${{ secrets.NTFY_URL }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: 🔍 DEBUG - Проверка структуры файлов
        run: |
          echo "=== Текущая рабочая директория ==="
          pwd
          echo "=== Содержимое корневой папки ==="
          ls -la
          echo "=== Содержимое папки src ==="
          ls -la src/ || echo "ОШИБКА: Папки src не существует!"
          echo "=== Проверка наличия main.py ==="
          ls -la src/main.py || echo "ОШИБКА: Файла src/main.py не существует!"
          echo "=== Содержимое requirements.txt ==="
          cat src/requirements.txt
          echo "=== Информация о последнем коммите ==="
          git log -1
          echo "=== Git Status ==="
          git status

      - name: 🚀 Run analysis script
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          COINGECKO_API: ${{ secrets.COINGECKO_API }}
        run: python src/main.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Добавляем файл и коммитим изменения
          git add data/market_snapshot.json
          git commit -m "Update market data ($(date +%H:%M) +05) [skip ci]" || echo "Нет изменений для коммита"
          
          # Пытаемся сделать rebase. Если возникает конфликт — разрешаем его в пользу НАШЕГО файла.
          if ! git pull --rebase origin main; then
            echo "⚠️ Обнаружен конфликт при rebase. Автоматически разрешаем в пользу свежих данных..."
            git checkout --theirs data/market_snapshot.json
            git add data/market_snapshot.json
            git rebase --continue
          fi
          
