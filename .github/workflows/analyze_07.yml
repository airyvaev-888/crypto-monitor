name: 📊 Анализ рынка (12:00 +05)

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: market-snapshot-write
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r src/requirements.txt

      - name: 🔍 DEBUG - Проверка структуры файлов
        run: |
          echo "=== Текущая рабочая директория ==="
          pwd
          echo "=== Содержимое корневой папки ==="
          ls -la
          echo "=== Содержимое папки src ==="
          ls -la src/ || echo "ОШИБКА: Папки src не существует!"
          echo "=== Проверка наличия main.py ==="
          ls -la src/main.py || echo "ОШИБКА: Файла src/main.py не существует!"
          echo "=== Информация о последнем коммите ==="
          git log -1
          echo "=== Git Status ==="
          git status

      - name: 🚀 Run analysis script
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          COINGECKO_API: ${{ secrets.COINGECKO_API }}
        run: python src/main.py

      - name: 💾 Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_snapshot.json
          git commit -m "Update market snapshot [skip ci]" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push
