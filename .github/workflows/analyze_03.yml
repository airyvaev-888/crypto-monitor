name: 📊 Анализ рынка (08:00 +05)

on:
  schedule:
    # 08:00 по Оренбургу (UTC+5) = 03:00 UTC
    - cron: '0 3 * * *' 
  workflow_dispatch: # Позволяет запускать вручную для теста

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Нужно для пуша изменений в папку data/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Run analysis script
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: python src/main.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update market data (08:00 +05) [skip ci]"
          git push
