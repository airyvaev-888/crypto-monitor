name: 📊 Анализ рынка (08:00 +05)

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC = 08:00 +05
  workflow_dispatch:

concurrency:
  group: market-snapshot-write
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🧪 Test ntfy notification
        run: |
          curl -d "Test message from GitHub Actions" ${{ secrets.NTFY_URL }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: 🚀 Run analysis script
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          COINGECKO_API: ${{ secrets.COINGECKO_API }}
        run: python src/main.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Добавляем ВСЕ измененные файлы данных и коммитим
          git add data/
          git commit -m "Update market data ($(date +%H:%M) +05) [skip ci]" || echo "Нет изменений для коммита"
          
          # Пытаемся сделать rebase. Если возникает конфликт — разрешаем его в пользу НАШИХ свежих данных.
          if ! git pull --rebase origin main; then
            echo "⚠️ Обнаружен конфликт при rebase. Автоматически разрешаем в пользу свежих данных..."
            # Для обоих файлов берем версию --theirs (наши новые данные)
            git checkout --theirs data/market_snapshot.json data/signals_history.json || true
            git add data/market_snapshot.json data/signals_history.json
            git rebase --continue || true
          fi
          
          # Пуш изменений
          git push origin main
