name: Crypto Monitor

on:
  schedule:
    # Запуск каждый час с 08:00 до 19:59 по Оренбургу (UTC+5)
    # Время в UTC: с 03:00 до 15:00
    - cron: '0 3-15 * * *'
  workflow_dispatch: # Возможность запустить вручную для теста

concurrency:
  group: state-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Копируем код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настраиваем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Устанавливаем библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запускаем бота
        env:
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
          # Если в скрипте используются другие секреты (например, токены API),
          # раскомментируй и добавь их здесь:
          # TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python crypto_monitor.py

      # 🔍 ДИАГНОСТИЧЕСКИЙ ШАГ (поможет найти файл, если он сохраняется не в корень)
      - name: Проверяем файлы в директории
        run: |
          echo "📂 Текущая директория: $(pwd)"
          echo "📄 Содержимое корневой папки:"
          ls -la
          echo "🔍 Поиск всех JSON-файлов в проекте:"
          find . -name "*.json" -not -path "./.git/*"

      - name: Фиксируем состояние (monitor_state.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Проверяем, существует ли файл и не пуст ли он
          if [ -f "monitor_state.json" ] && [ -s "monitor_state.json" ]; then
            echo "📝 Файл monitor_state.json найден, добавляем в индекс..."
            git add monitor_state.json
            
            # Проверяем, есть ли реальные изменения
            if ! git diff --cached --quiet; then
              echo "✅ Изменения обнаружены, создаем коммит..."
              git commit -m "Update monitor_state.json [skip ci]"
              git push
              echo "🚀 Коммит успешно отправлен."
            else
              echo "ℹ️ Файл существует, но изменений нет. Коммит не требуется."
            fi
          else
            echo "⚠️ Файл monitor_state.json отсутствует или пуст. Пропускаем фиксацию."
          fi
