name: Crypto Monitor

on:
  schedule:
    # Запуск каждый час с 08:00 до 19:59 по Оренбургу (UTC+5)
    - cron: '0 3-15 * * *'
  workflow_dispatch:

concurrency:
  group: state-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Копируем код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настраиваем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Устанавливаем библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запускаем бота
        env:
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
        run: python crypto_monitor.py

      - name: Фиксируем состояние (monitor_state.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f "monitor_state.json" ] && [ -s "monitor_state.json" ]; then
            echo "📝 Файл monitor_state.json найден, добавляем в индекс..."
            git add monitor_state.json
            
            if ! git diff --cached --quiet; then
              echo "✅ Изменения обнаружены, создаем коммит..."
              git commit -m "Update monitor_state.json [skip ci]"
              git push
              echo "🚀 Коммит успешно отправлен."
            else
              echo "ℹ️ Файл существует, но изменений нет. Коммит не требуется."
            fi
          else
            echo "⚠️ Файл monitor_state.json отсутствует или пуст. Пропускаем фиксацию."
          fi
