name: Crypto Monitor

on:
  schedule:
    # Запуск каждый час с 08:00 до 19:59 по Оренбургу (UTC+5)
    # В UTC это 03:00 – 14:00. 
    # Последний запуск в 14:00 UTC отработает по данным свечи 13:00-14:00,
    # что соответствует 18:00-19:00 Оренбурга. 
    # Чтобы захватить интервал до 20:00, нужен запуск в 15:00 UTC (20:00 Оренбург).
    - cron: '0 3-15 * * *' 
  workflow_dispatch:

concurrency:
  group: state-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Копируем код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настраиваем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Устанавливаем библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запускаем бота
        env:
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
        run: python crypto_monitor.py

      - name: Фиксируем состояние (monitor_state.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add monitor_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          git commit -m "Update monitor_state.json [skip ci]"
          git push
