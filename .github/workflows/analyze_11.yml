name: 📊 Анализ рынка (16:00 +05)

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: market-snapshot-write
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r src/requirements.txt
      - env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          COINGECKO_API: ${{ secrets.COINGECKO_API }}
        run: python src/main.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Добавляем ВСЕ файлы из папки data (и snapshot, и history)
          git add data/
          
          # Коммитим только если есть изменения, иначе пишем в лог и идем дальше
          git commit -m "Update market data [skip ci]" || echo "No changes to commit"
          
          git pull --rebase origin ${{ github.ref_name }}
          git push
